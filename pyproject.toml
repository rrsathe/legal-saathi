[project]
name = "legal-saathi"
version = "0.1.0"
description = "AI Consumer Lawyer for India (CPA 2019 & E-Commerce Rules 2020)"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Legal Saathi Multi-Agent Team" }
]
dependencies = [
    "pydantic>=2.10.0,<=2.10.6",
    "pydantic-settings>=2.7.0,<3.0.0",
    "litellm>=1.50.0",
    "groq>=0.11.0",
    "ollama>=0.4.0",
    "gradio>=4.31.0,<5.0.0",
    "huggingface-hub<=0.24.7",
    "rank-bm25>=0.2.2",
    "chromadb>=0.5.0,<=0.5.16",
    "faiss-cpu>=1.9.0",
    "theflow>=0.8.6,<0.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "starlette<1.0.0",
    "fastapi<0.116.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ty>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ty>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_assistant"]

# ==============================================================================
# Ruff Configuration: Linting, Formatting & Google Docstrings
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "D",    # pydocstyle (docstring conventions)
]
ignore = [
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__ (covered by class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "S101", # Use of assert detected
    "ARG",  # Unused function argument (fixtures in test signatures)
]
"scripts/*" = [
    "D100", # Missing docstring in public module
    "D103", # Missing docstring in public function
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==============================================================================
# Mypy Configuration: Strict Static Type Checking
# ==============================================================================
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "scripts"]
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "kotaemon.*",
    "ktem.*",
    "theflow.*",
    "rank_bm25.*",
    "faiss.*",
    "gradio.*",
    "litellm.*",
    "ollama.*",
    "groq.*",
    "chromadb.*",
]
ignore_missing_imports = true

# ==============================================================================
# Ty Configuration: Fast Astral Type Checker
# ==============================================================================
[tool.ty.environment]
python-version = "3.11"
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "kotaemon.**",
    "ktem.**",
    "theflow.**",
    "rank_bm25.**",
    "faiss.**",
    "gradio.**",
    "chromadb.**",
    "litellm.**",
    "ollama.**",
    "groq.**",
    "scripts.**",
]
replace-imports-with-any = [
    "kotaemon.**",
    "ktem.**",
    "theflow.**",
    "rank_bm25.**",
    "faiss.**",
    "gradio.**",
    "chromadb.**",
    "litellm.**",
    "ollama.**",
    "groq.**",
    "scripts.**",
]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
unused-ignore-comment = "ignore"

[tool.ty.terminal]
output-format = "concise"

# ==============================================================================
# Pytest Configuration: Discovery, Coverage & Async Execution
# ==============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
